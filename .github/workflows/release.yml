name: Release images

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        component: [api, web]
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve release metadata
        id: release
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          [[ "$version" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$ ]]
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "repository=${GITHUB_REPOSITORY,,}" >>"$GITHUB_OUTPUT"
          echo "build_time=$(git show -s --format=%cI "$GITHUB_SHA")" >>"$GITHUB_OUTPUT"
      - name: Build and publish ${{ matrix.component }}
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/images/${{ matrix.component }}.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ steps.release.outputs.repository }}-${{ matrix.component }}:${{ steps.release.outputs.version }}
          build-args: |
            CANVAS_VERSION=${{ steps.release.outputs.version }}
            CANVAS_BUILD_ID=${{ steps.release.outputs.version }}
            CANVAS_REVISION=${{ github.sha }}
            CANVAS_BUILD_TIME=${{ steps.release.outputs.build_time }}
            CANVAS_SOURCE_URL=${{ github.server_url }}/${{ github.repository }}/tree/${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
      - name: Record immutable image
        run: echo "ghcr.io/${{ steps.release.outputs.repository }}-${{ matrix.component }}@${{ steps.build.outputs.digest }}" >>"$GITHUB_STEP_SUMMARY"
