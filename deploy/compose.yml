name: canvas-${CANVAS_SLOT:?CANVAS_SLOT is required}

x-backend: &backend
  image: ${CANVAS_API_IMAGE:?CANVAS_API_IMAGE is required}
  restart: unless-stopped
  init: true
  read_only: true
  user: "1000:1000"
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m,uid=1000,gid=1000
  environment: &backend-environment
    CANVAS_RELEASE: ${CANVAS_RELEASE:?CANVAS_RELEASE is required}
    CANVAS_DATABASE_URL_FILE: /run/secrets/canvas-database-url
    CANVAS_OFFICIAL_BASE_URL: ${CANVAS_OFFICIAL_BASE_URL:-http://host.docker.internal:18080}
    CANVAS_OBJECT_ROOT: /var/lib/canvas/objects
    CANVAS_WRITES_ENABLED: ${CANVAS_WRITES_ENABLED:-false}
    CANVAS_AUTH_CACHE_TTL: ${CANVAS_AUTH_CACHE_TTL:-20s}
    CANVAS_CREDENTIAL_ACTIVE_KEY_VERSION: ${CANVAS_CREDENTIAL_ACTIVE_KEY_VERSION:-1}
    CANVAS_CREDENTIAL_KEY_V1_FILE: /run/secrets/canvas-credential-key-v1
    CANVAS_CONTAINER_NETWORK_LISTEN: "true"
    CANVAS_ALLOWED_EXTERNAL_USER_IDS: ${CANVAS_ALLOWED_EXTERNAL_USER_IDS:-}
  extra_hosts:
    - host.docker.internal:host-gateway
  volumes:
    - ${CANVAS_OBJECT_DIR:?CANVAS_OBJECT_DIR is required}:/var/lib/canvas/objects
    - ${CANVAS_SECRETS_DIR:?CANVAS_SECRETS_DIR is required}/database-url:/run/secrets/canvas-database-url:ro
    - ${CANVAS_SECRETS_DIR:?CANVAS_SECRETS_DIR is required}/credential-key-v1:/run/secrets/canvas-credential-key-v1:ro
  depends_on:
    database:
      condition: service_healthy
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "5"

services:
  database:
    image: ${CANVAS_POSTGRES_IMAGE:-postgres@sha256:16bc17c64a573ef34162af9298258d1aec548232985b33ed7b1eac33ba35c229}
    container_name: canvas_${CANVAS_SLOT}_postgres
    restart: unless-stopped
    shm_size: 64m
    environment:
      POSTGRES_USER: canvas
      POSTGRES_DB: sub2api_canvas
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
    volumes:
      - canvas_database:/var/lib/postgresql/data
      - ${CANVAS_SECRETS_DIR:?CANVAS_SECRETS_DIR is required}/postgres-password:/run/secrets/postgres-password:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U canvas -d sub2api_canvas"]
      interval: 5s
      timeout: 4s
      retries: 20
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    ports:
      - 127.0.0.1:${CANVAS_DATABASE_PORT:?CANVAS_DATABASE_PORT is required}:5432
    mem_limit: 192m
    cpus: 0.75
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  migrate:
    <<: *backend
    restart: "no"
    entrypoint: ["/usr/local/bin/canvas-migrate"]
    command: ["up"]
    mem_limit: 96m
    cpus: 0.5

  api:
    <<: *backend
    container_name: canvas_${CANVAS_SLOT}_api
    environment:
      <<: *backend-environment
      CANVAS_LISTEN_ADDRESS: 0.0.0.0:8081
    entrypoint: ["/usr/local/bin/canvas-api"]
    ports:
      - 127.0.0.1:${CANVAS_API_PORT:?CANVAS_API_PORT is required}:8081
    healthcheck:
      test: ["CMD", "/usr/local/bin/canvas-healthcheck", "http://127.0.0.1:8081/canvas-api/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    mem_limit: 128m
    cpus: 0.75

  worker:
    <<: *backend
    container_name: canvas_${CANVAS_SLOT}_worker
    environment:
      <<: *backend-environment
      CANVAS_LISTEN_ADDRESS: 0.0.0.0:8082
    entrypoint: ["/usr/local/bin/canvas-worker"]
    healthcheck:
      test: ["CMD", "/usr/local/bin/canvas-healthcheck", "http://127.0.0.1:8082/canvas-worker/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    mem_limit: 192m
    cpus: 1.0

  web:
    image: ${CANVAS_WEB_IMAGE:?CANVAS_WEB_IMAGE is required}
    container_name: canvas_${CANVAS_SLOT}_web
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
    tmpfs:
      - /var/cache/nginx:rw,noexec,nosuid,size=16m
      - /var/run:rw,noexec,nosuid,size=1m
      - /tmp:rw,noexec,nosuid,size=8m
    ports:
      - 127.0.0.1:${CANVAS_WEB_PORT:?CANVAS_WEB_PORT is required}:8080
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health/ready"]
      interval: 5s
      timeout: 4s
      retries: 20
      start_period: 5s
    mem_limit: 64m
    cpus: 0.5
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

volumes:
  canvas_database:
    name: ${CANVAS_DATABASE_VOLUME:?CANVAS_DATABASE_VOLUME is required}
